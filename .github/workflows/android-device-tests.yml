name: Android device tests

# Runs the whole instrumented suite (app/src/androidTest: the keystore pairing store, the HEVC
# decode path, mention parsing, the press gestures and the browser canvas's real touch path) on
# an Android emulator (API 35, x86_64, KVM on a hosted Linux runner) and prints every test's
# result in the log.
#
# Manual, and on pushes to the bring-up branch that touch the device tests or this workflow.
on:
  workflow_dispatch:
  push:
    branches: [claude/pairing-milestone-handover-8y7390]
    paths:
      - app/src/androidTest/**
      - .github/workflows/android-device-tests.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: '35'
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` exits on SIGPIPE when sdkmanager stops reading; ignore that under pipefail.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Built before the emulator boots, so a compile failure fails fast.
      - name: Build the app and its device tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the emulator image
        id: avd-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-v1

      # A cold boot once, saved as a snapshot the test run boots from.
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "snapshot created"

      - name: Run the device tests
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --continue

      # Every test's outcome, and each failure's first lines, as text in the job log.
      - name: Print the device test results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          files = sorted(glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True))
          if not files:
              print('no device test results (the run did not reach the tests)')
          totals = {'passed': 0, 'failed': 0, 'skipped': 0}
          for path in files:
              for case in ET.parse(path).getroot().iter('testcase'):
                  name = f"{case.get('classname')}.{case.get('name')}"
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None:
                      totals['failed'] += 1
                      print(f'FAILED  {name}')
                      for line in (failure.text or failure.get('message') or '').splitlines()[:12]:
                          print(f'        {line}')
                  elif case.find('skipped') is not None:
                      totals['skipped'] += 1
                      print(f'SKIPPED {name}')
                  else:
                      totals['passed'] += 1
                      print(f'passed  {name} ({case.get("time")} s)')
          print(f"device tests: {totals['passed']} passed, {totals['failed']} failed, {totals['skipped']} skipped")
          EOF

      - name: Upload the device test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: warn
