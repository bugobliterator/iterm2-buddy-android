name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short-sha: ${{ steps.meta.outputs.short-sha }}
      shared-keystore: ${{ steps.keystore.outputs.shared-keystore }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        run: echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` exits on SIGPIPE when sdkmanager stops reading; ignore that under pipefail.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore shared debug keystore
        id: keystore
        env:
          # The shared key only reaches runs of main's own code in this repository
          # (push or manual dispatch); pull requests always use a generated key.
          TRUSTED_RUN: ${{ github.repository == 'bugobliterator/iterm2-buddy-android' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          DEBUG_KEYSTORE_BASE64: ${{ github.repository == 'bugobliterator/iterm2-buddy-android' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.DEBUG_KEYSTORE_BASE64 || '' }}
        run: |
          if [ "$TRUSTED_RUN" != true ]; then
            echo "::warning::Not a main-branch run of bugobliterator/iterm2-buddy-android: APKs are signed with a generated debug key, so installing them over another build needs an uninstall (which deletes the pairing)."
            echo "shared-keystore=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey > /dev/null
            echo "shared-keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set: APKs are signed with a generated debug key, so installing them over another build needs an uninstall (which deletes the pairing)."
            echo "shared-keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and unit test
        run: >
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
          -PciVersionCode=${{ github.run_number }}
          -PciVersionName=0.1.0-${{ steps.meta.outputs.short-sha }}

      - name: Hash APKs
        env:
          SHARED_KEYSTORE: ${{ steps.keystore.outputs.shared-keystore }}
        run: |
          mkdir apks
          cp app/build/outputs/apk/debug/app-debug.apk apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/
          (cd apks && sha256sum app-debug.apk app-debug-androidTest.apk > apk-sha256.txt)
          {
            echo "### Debug APKs"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: 0.1.0-${GITHUB_SHA::7} (versionCode $GITHUB_RUN_NUMBER)"
            echo "- Shared debug keystore used: $SHARED_KEYSTORE"
            echo
            echo '```'
            cat apks/apk-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pairing-apks-${{ steps.meta.outputs.short-sha }}
          path: apks/
          retention-days: 14
          if-no-files-found: error

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ steps.meta.outputs.short-sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

  distribute:
    needs: build
    if: github.repository == 'bugobliterator/iterm2-buddy-android' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHORT_SHA: ${{ needs.build.outputs.short-sha }}
      SHARED_KEYSTORE: ${{ needs.build.outputs.shared-keystore }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Check distribution prerequisites
        id: check
        run: |
          missing=()
          [ "$SHARED_KEYSTORE" = true ] || missing+=("secret DEBUG_KEYSTORE_BASE64 (the build used a generated debug key)")
          [ "$HAS_SERVICE_ACCOUNT" = true ] || missing+=("secret FIREBASE_SERVICE_ACCOUNT_JSON")
          [ -n "$FIREBASE_APP_ID" ] || missing+=("variable FIREBASE_APP_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            for item in "${missing[@]}"; do
              echo "::warning::Skipping the Firebase App Distribution upload: missing $item."
            done
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.check.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pairing-apks-${{ needs.build.outputs.short-sha }}
          path: apks

      - if: steps.check.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Firebase CLI
        if: steps.check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --dir ci/firebase

      - name: Write release notes
        if: steps.check.outputs.ready == 'true'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "Version: 0.1.0-$SHORT_SHA"
            echo "Commit: $GITHUB_SHA"
            echo "Subject: ${COMMIT_MESSAGE%%$'\n'*}"
            echo
            echo "SHA-256:"
            cat apks/apk-sha256.txt
          } > "$RUNNER_TEMP/release-notes.txt"

      - name: Upload to Firebase App Distribution
        if: steps.check.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials")
          if ! jq -e '.type == "service_account" and (.private_key | length > 0) and (.client_email | length > 0)' "$credentials" >/dev/null 2>&1; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not a service account key file (need JSON with type service_account, private_key, client_email)."
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          ci/firebase/node_modules/.bin/firebase appdistribution:distribute apks/app-debug.apk \
            --app "$FIREBASE_APP_ID" --groups owner \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"

      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
