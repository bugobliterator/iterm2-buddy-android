name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short-sha: ${{ steps.meta.outputs.short-sha }}
      shared-keystore: ${{ steps.keystore.outputs.shared-keystore }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: meta
        run: echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` exits on SIGPIPE when sdkmanager stops reading; ignore that under pipefail.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore shared debug keystore
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey > /dev/null
            echo "shared-keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set: APKs are signed with a generated debug key, so installing them over another build needs an uninstall (which deletes the pairing)."
            echo "shared-keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and unit test
        run: >
          ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
          -PciVersionCode=${{ github.run_number }}
          -PciVersionName=0.1.0-${{ steps.meta.outputs.short-sha }}

      - name: Hash APKs
        env:
          SHARED_KEYSTORE: ${{ steps.keystore.outputs.shared-keystore }}
        run: |
          mkdir apks
          cp app/build/outputs/apk/debug/app-debug.apk apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/
          (cd apks && sha256sum app-debug.apk app-debug-androidTest.apk > apk-sha256.txt)
          {
            echo "### Debug APKs"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: 0.1.0-${GITHUB_SHA::7} (versionCode $GITHUB_RUN_NUMBER)"
            echo "- Shared debug keystore used: $SHARED_KEYSTORE"
            echo
            echo '```'
            cat apks/apk-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pairing-apks-${{ steps.meta.outputs.short-sha }}
          path: apks/
          retention-days: 14
          if-no-files-found: error

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ steps.meta.outputs.short-sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHORT_SHA: ${{ needs.build.outputs.short-sha }}
    steps:
      - name: Check signing key
        if: needs.build.outputs.shared-keystore != 'true'
        run: |
          echo "::warning::Skipping the pre-release: DEBUG_KEYSTORE_BASE64 is not set, and a build signed with a generated key would break Obtainium updates."

      - if: needs.build.outputs.shared-keystore == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pairing-apks-${{ needs.build.outputs.short-sha }}
          path: apks

      - name: Publish pre-release
        if: needs.build.outputs.shared-keystore == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$SHORT_SHA"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::warning::Release $tag already exists; not publishing again."
            exit 0
          fi
          cp apks/app-debug.apk "itermbuddy-debug-$SHORT_SHA.apk"
          {
            echo "Debug build of commit \`$GITHUB_SHA\`, signed with the shared debug key."
            echo
            echo "SHA-256 (the androidTest APK is in the workflow run's artifact):"
            echo
            echo '```'
            cat apks/apk-sha256.txt
            echo '```'
          } > release-notes.md
          gh release create "$tag" "itermbuddy-debug-$SHORT_SHA.apk" \
            --prerelease --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
